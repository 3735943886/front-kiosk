name: android

on:
  push:
    branches: [main]
    paths: ["android/**", "web/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "web/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 고정 서명 키 (없으면 Gradle 기본 debug 키로 서명 → 기기에서 업데이트 설치가 안 될 수 있음)
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KIOSK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/kiosk.keystore
            echo "signing with repository key"
          else
            echo "::warning::KIOSK_KEYSTORE_B64 secret not set; using throwaway debug key"
          fi

      - name: Build APK
        working-directory: android
        env:
          KIOSK_KEYSTORE_PASS: ${{ secrets.KIOSK_KEYSTORE_PASS }}
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
