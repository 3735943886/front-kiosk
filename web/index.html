<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Front 대시보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Manrope:wght@200;300;500&display=swap">
<style>
/* Layout: screen splits into a clock zone (top, flexible) and a notification dock (bottom, sized by content).
   The clock+weather block sits centred in its zone, drifts a few px for burn-in, and scales down rather than
   ever entering the dock. Single dark look by design. */
:root {
  --bg: #080b12;        /* page ground */
  --sky: #13203d;       /* time-of-day glow, set from JS */
  --fg: #d6d9e0;        /* main text, soft grey instead of white */
  --dim: #7f879a;       /* secondary text */
  --faint: #252d3e;     /* hairlines */
  --surface: #111725;   /* cards */
  --surface-2: #1a2236; /* pressed / sheet */
  --lamp: #e9b072;      /* warm accent: current step, focus */
  --info: #8fb0f5;
  --warn: #f1c35a;
  --urgent: #ff7f70;
  --ok: #7fcfa5;
  --rain: #9fb3d8;      /* precipitation particles */
  --snow: #e4e8f0;
  --plan: #efd6b2;      /* 일정 패널 글자: 시계·날씨(무채색)와 구분되는 따뜻한 톤 */
  --plan-dim: #a8957a;
  --f-clock: "Manrope", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-ui: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-ui);
  font-size: 15px;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
body::after { /* time-of-day glow */
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(120% 70% at 50% -10%, var(--sky), transparent 70%);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; transition: opacity 2s; }
body.night #fx { opacity: .45; }
#stage {
  position: relative; z-index: 1; height: 100%;
  display: flex; flex-direction: column; gap: 16px;
  transition: transform 2s ease;
}

/* ---------- clock zone ---------- */
#zone { position: relative; flex: 1 1 auto; min-height: 0; }
#float {
  position: absolute; left: 0; top: 0;
  display: flex; flex-direction: column; gap: 14px;
  width: max-content;
  transform-origin: 0 0;
  will-change: transform;
  transition-property: transform, opacity;
  transition-timing-function: ease-in-out;
}
.clock {
  width: max-content;
  font-family: var(--f-clock);
  font-weight: 200;
  font-size: min(31vw, 21vh);
  line-height: .9;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  margin-left: -0.04em;
}
.clock .colon { opacity: .55; }
.date {
  font-size: min(5.6vw, 3.6vh); color: var(--dim); letter-spacing: .02em;
  display: flex; align-items: baseline; gap: .5em; white-space: nowrap; overflow: hidden;
}
.date b { color: var(--fg); font-weight: 400; }
.date.holiday #dateText, .date.holiday b { color: var(--urgent); }
/* 종일 일정 줄 (일정 패널 첫 줄): "김장 · 엄마 생일 · 제주 여행 2/3일" */
#dayEvents { display: flex; gap: .5em; min-width: 0; overflow: hidden; white-space: nowrap; cursor: pointer; padding-left: 14px; }
#dayEvents:empty { display: none; }
.de { flex: none; color: var(--plan); font-weight: 500; }
.de + .de::before { content: "·"; margin-right: .5em; color: var(--plan-dim); font-weight: 400; }
.de.hol { color: var(--urgent); }
.de i { font-style: normal; color: var(--plan-dim); font-size: .8em; font-weight: 400; }
.de.solo { overflow: hidden; text-overflow: ellipsis; }
.de-more { flex: none; color: var(--plan-dim); }

/* today's agenda: one line inside the drifting block */
/* 일정 패널: 종일 일정 줄 + 시간 일정 줄을 한 덩어리로 (시계·날씨와 구분) */
#agendaBox {
  display: flex; flex-direction: column; gap: 4px;
  margin-top: 14px; padding: 8px 14px 8px 12px;
  border-radius: 14px;
  background: color-mix(in srgb, var(--lamp) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--lamp) 16%, transparent);
  font-size: min(4.8vw, 3vh);
}
.agenda {
  display: flex; align-items: center; gap: 10px; padding: 2px 0;
  background: none; border: 0; cursor: pointer; text-align: left;
  font-size: 1em; color: var(--plan); max-width: 100%;
}
.agenda .bar { width: 4px; align-self: stretch; border-radius: 2px; background: var(--ec, var(--lamp)); flex: none; }
/* 오늘 남은 일정을 한 줄로: 다음 일정은 진하게, 그 뒤는 흐리게, 넘치면 "외 N건" */
.agenda .its { display: flex; gap: .55em; min-width: 0; overflow: hidden; white-space: nowrap; }
.agenda .it { flex: none; color: var(--plan-dim); }
.agenda .it + .it::before { content: "·"; margin-right: .55em; color: var(--plan-dim); }
.agenda .it .t { font-weight: 600; font-variant-numeric: tabular-nums; }
.agenda .it.next { color: var(--plan); }
.agenda .it.live .t { color: var(--lamp); }
.agenda .it.solo { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.agenda .pre, .agenda .more-ev, .agenda .chev { color: var(--plan-dim); flex: none; }
.agenda .chev { font-size: 1.2em; line-height: 1; }
.agenda.later .it.next { color: var(--plan-dim); }
#dateText { cursor: pointer; }
/* 일정이 하나도 없을 때만 요일 옆에 보이는 추가 버튼 */
#dateAdd {
  flex: none; align-self: center; width: 1.5em; height: 1.5em; margin-left: .1em;
  display: grid; place-items: center; padding: 0; font-size: 1em; line-height: 1;
  color: var(--dim); background: none; border: 1px solid var(--faint); border-radius: 50%; cursor: pointer;
}
/* 공간이 모자라면 덜 중요한 것부터 숨김: 시간별 예보 → 날씨 설명 → 일정 줄 */
#float.c1 .wx-hours, #float.c2 .wx-hours, #float.c3 .wx-hours { display: none; }
#float.c2 .wx-desc, #float.c3 .wx-desc { display: none; }
#float.c3 #agendaBox { display: none; }

.wx { display: flex; flex-direction: column; gap: 14px; }
.wx-now { display: flex; align-items: center; gap: 14px; }
.wx-now svg { width: min(15vw, 9.5vh); height: min(15vw, 9.5vh); color: var(--fg); flex: none; }
.wx-temp { font-family: var(--f-clock); font-weight: 300; font-size: min(14vw, 9vh); line-height: 1; font-variant-numeric: tabular-nums; }
.wx-temp sup { font-size: .45em; color: var(--dim); vertical-align: .9em; margin-left: 2px; }
.wx-desc { display: flex; flex-direction: column; gap: 3px; font-size: 15px; color: var(--dim); }
.wx-desc .cond { color: var(--fg); font-size: 19px; }
.wx-hours {
  display: grid; grid-template-columns: repeat(6, 56px); gap: 6px; justify-content: space-between;
  border-top: 1px solid var(--faint); padding-top: 14px;
}
.hr { display: flex; flex-direction: column; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.hr .t { font-size: 13px; color: var(--dim); }
.hr svg { width: 26px; height: 26px; color: var(--fg); opacity: .85; }
.hr .v { font-size: 17px; }
.hr .p { font-size: 13px; color: var(--info); min-height: 1em; }
.tag {
  display: inline-block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--dim); border: 1px solid var(--faint); border-radius: 4px; padding: 1px 5px; vertical-align: middle;
}

/* ---------- notification dock ---------- */
#dock { flex: none; display: flex; flex-direction: column; gap: 8px; }
#dock:empty { display: none; }
.lv-info { --lc: var(--info); } .lv-warn { --lc: var(--warn); } .lv-urgent { --lc: var(--urgent); } .lv-ok { --lc: var(--ok); }
.ico {
  width: 52px; height: 52px; border-radius: 13px; display: grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--lc) 16%, transparent); color: var(--lc);
}
.ico svg { width: 28px; height: 28px; }
.ico.sm { width: 36px; height: 36px; border-radius: 10px; }
.ico.sm svg { width: 20px; height: 20px; }

.card {
  display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: start;
  text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--faint); border-radius: 16px;
  padding: 16px;
}
.card:active, .row:active { background: var(--surface-2); }
.card.lv-urgent, .row.lv-urgent { border-color: color-mix(in srgb, var(--urgent) 60%, var(--faint)); }
.c-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.c-meta { font-size: 14px; color: var(--dim); display: flex; gap: 7px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lc); flex: none; }
.lv-urgent .dot { animation: pulse 1.6s ease-in-out infinite; }
.c-title { font-size: 21px; font-weight: 500; line-height: 1.3; }
.c-body { font-size: 16px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-html { font-size: 16px; line-height: 1.4; min-width: 0; overflow: hidden; max-height: 9em; }
.chev { color: var(--dim); font-size: 28px; line-height: 52px; }

.row {
  display: grid; grid-template-columns: 36px 1fr auto auto; gap: 12px; align-items: center;
  cursor: pointer; background: var(--surface); border: 1px solid var(--faint); border-radius: 12px;
  padding: 9px 14px 9px 10px;
}
.r-title { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.r-title small { color: var(--dim); font-size: 14px; margin-left: 6px; }
.r-time { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
.row .chev { font-size: 22px; line-height: 1; }
.more { align-self: center; background: none; border: 1px solid var(--faint); border-radius: 999px; color: var(--dim); padding: 8px 18px; font-size: 15px; cursor: pointer; }

.steps { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px; margin-top: 8px; }
.step { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--dim); }
.step i { display: block; height: 4px; border-radius: 2px; background: var(--faint); }
.step.done i { background: color-mix(in srgb, var(--lamp) 55%, var(--faint)); }
.step.now i { background: var(--lamp); }
.step.now { color: var(--fg); }

/* ---------- toast ---------- */
#toast {
  position: absolute; left: 0; right: 0; top: 0; z-index: 5;
  display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center;
  background: var(--surface-2); border: 1px solid var(--faint); border-radius: 16px; padding: 16px;
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
  transform: translateY(calc(-100% - 80px)); visibility: hidden;
  transition: transform .45s cubic-bezier(.2,.8,.2,1), visibility 0s .45s;
}
#toast.show { transform: translateY(0); visibility: visible; transition-delay: 0s; }
#toast .c-title { font-size: 22px; }

/* ---------- detail sheet ---------- */
#sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; background: rgba(4,6,10,.72); animation: fade .25s ease both; }
.sheet-in {
  width: 100%; max-height: 88%; overflow-y: auto;
  background: var(--surface); border-top: 1px solid var(--faint); border-radius: 20px 20px 0 0;
  padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 16px;
  animation: rise .3s ease both;
}
.sh-head { display: flex; gap: 12px; align-items: center; }
.sh-title { font-size: 26px; font-weight: 500; text-wrap: balance; margin: 0; }
.sh-body { font-size: 17px; color: var(--fg); line-height: 1.6; margin: 0; white-space: pre-wrap; }
.sh-html { font-size: 17px; line-height: 1.6; overflow-wrap: anywhere; }
.sh-fields { display: grid; grid-template-columns: max-content 1fr; gap: 10px 20px; margin: 0; font-size: 17px; }
.sh-fields dt { color: var(--dim); }
.sh-fields dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.sh-frame { width: 100%; height: 60vh; border: 1px solid var(--faint); border-radius: 12px; background: #000; }
.sh-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1 1 auto; min-height: 56px; border-radius: 14px; border: 1px solid var(--faint); background: var(--surface-2); cursor: pointer; padding: 0 18px; font-size: 17px; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 500; }
.btn.danger { border-color: var(--urgent); color: var(--urgent); }
.sh-list { display: flex; flex-direction: column; gap: 8px; }
.ev-day { font-size: 14px; color: var(--dim); letter-spacing: .04em; margin: 4px 0 -8px; }
.ev-list { display: flex; flex-direction: column; }
.ev {
  display: grid; grid-template-columns: 62px 4px 1fr auto; gap: 12px; align-items: center;
  padding: 12px 2px; border-bottom: 1px solid var(--faint); cursor: pointer;
}
.ev:last-child { border-bottom: 0; }
.ev:active { background: var(--surface-2); }
.ev .t { font-size: 16px; font-variant-numeric: tabular-nums; }
.ev .t small { display: block; font-size: 13px; color: var(--dim); }
.ev .b { width: 4px; align-self: stretch; min-height: 34px; border-radius: 2px; background: var(--ec, var(--lamp)); }
.ev .ti { font-size: 18px; display: block; }
.ev .lo { font-size: 14px; color: var(--dim); display: block; }
.ev .chev { font-size: 22px; line-height: 1; color: var(--dim); }
.ev.past { opacity: .45; }
.ev.now .t { color: var(--lamp); }
.ev-empty { color: var(--dim); font-size: 16px; padding: 8px 0; }

/* 일정 추가 */
.form { display: flex; flex-direction: column; gap: 12px; }
.f-row { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; font-size: 15px; color: var(--dim); }
.form input[type="text"], .form input[type="date"], .form input[type="time"] {
  font: inherit; font-size: 18px; color: var(--fg); background: var(--surface-2);
  border: 1px solid var(--faint); border-radius: 10px; padding: 8px 12px; min-height: 48px; width: 100%;
  color-scheme: dark; user-select: text;
}
.form input:focus { outline: 2px solid var(--lamp); outline-offset: 1px; }
.times { display: flex; align-items: center; gap: 8px; color: var(--dim); }
.times input { flex: 1; min-width: 0; }
#f-endwrap { display: flex; align-items: center; gap: 8px; flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips input[type="date"] { width: auto; flex: 1 1 140px; }
.chip {
  min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--faint);
  background: var(--surface-2); font-size: 16px; cursor: pointer;
}
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chk {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px;
  border: 1px solid var(--faint); border-radius: 999px; font-size: 16px; color: var(--fg); cursor: pointer;
}
.chk input { width: 20px; height: 20px; accent-color: var(--lamp); }
.f-msg { margin: 0; min-height: 1.2em; color: var(--urgent); font-size: 15px; }
.btn:disabled { opacity: .5; }

/* ---------- night ---------- */
body.night #float { opacity: .4; }
body.night .wx-hours { display: none; }
body.night #dock { opacity: .75; }

/* ---------- demo controls (hidden when native shell is present) ---------- */
#demoBtn { position: absolute; right: 0; top: 0; z-index: 6; background: none; border: 1px solid var(--faint); border-radius: 8px; color: var(--dim); font-size: 12px; padding: 4px 10px; cursor: pointer; opacity: .6; }
#demo { position: absolute; right: 0; top: 34px; z-index: 6; width: min(270px, 100%); max-height: calc(100% - 40px); overflow-y: auto; display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); border: 1px solid var(--faint); border-radius: 12px; padding: 10px; }
#demo button { text-align: left; background: var(--surface); border: 1px solid var(--faint); border-radius: 8px; padding: 9px 10px; font-size: 13px; cursor: pointer; }
#demo p { margin: 2px 2px 4px; font-size: 11px; color: var(--dim); }

@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  #float { transition-duration: 0s !important; }
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main id="stage">
  <section id="zone">
    <div id="float" aria-label="시계와 날씨">
      <div>
        <div class="clock" id="clock">--<span class="colon">:</span>--</div>
        <div class="date" id="date"><span id="dateText"></span><button type="button" id="dateAdd" aria-label="일정 추가" hidden>＋</button></div>
        <div id="agendaBox" hidden>
          <div id="dayEvents"></div>
          <button type="button" class="agenda" id="agenda" hidden></button>
        </div>
      </div>
      <div class="wx" id="wx"></div>
    </div>
  </section>

  <section id="dock" aria-label="알림"></section>

  <div id="toast" role="status" aria-live="polite"></div>

  <button id="demoBtn" type="button" hidden>데모</button>
  <div id="demo" hidden>
    <p>예시 알림으로 화면 동작을 확인하는 패널입니다. 기기 앱에서는 숨겨집니다.</p>
    <button type="button" id="dm-delivery">배달 진행: 다음 단계</button>
    <button type="button" id="dm-fridge">냉장고 문 열림 (1분마다 반복)</button>
    <button type="button" id="dm-html">HTML 카드 (분리수거)</button>
    <button type="button" id="dm-info">일반 알림</button>
    <button type="button" id="dm-urgent">긴급 알림</button>
    <button type="button" id="dm-cal">일정 미리 알림 시험 (30분 전)</button>
    <button type="button" id="dm-fx">배경 날씨 효과: 자동</button>
    <button type="button" id="dm-night">야간 모드 켜기/끄기</button>
    <button type="button" id="dm-clear">알림 모두 지우기</button>
  </div>
</main>

<div id="sheet" hidden></div>

<script src="ics.js"></script>
<script src="apps/registry.js"></script>
<script src="apps/delivery.js"></script>
<script src="apps/baemin.js"></script>
<script src="apps/coupangeats.js"></script>
<script>
"use strict";
/* ================= config ================= */
const CONFIG = {
  place: "서울", lat: 37.5665, lon: 126.978,    // 기본값. 실제 위치는 기기 설정(place/lat/lon)이 덮어씀
  weatherRefreshMin: 15,
  driftPx: 20,                                  // 시계가 중심에서 움직이는 최대 거리
  driftEverySec: 150, driftDurationSec: 110,    // 이동 주기 / 한 번 이동에 걸리는 시간
  pixelShiftSec: 60,                            // 전체 화면 ±2px 미세 이동
  night: { start: 0, end: 6 },                  // 화면을 어둡게 하는 시간
  quiet: { start: 22, end: 8 },                 // 이 시간엔 긴급 알림만 음성
  fullCards: 1,                                 // 큰 카드로 보여줄 개수
  compactRows: 3,                               // 그다음 축약 카드 개수, 넘치면 "N건 더 보기"
  idleResetSec: 30,                             // 조작이 없으면 이 시간 뒤 초기 화면으로
  agendaRemindMin: null,                        // 일정 기본 미리 알림(분). 일정별 remindBeforeMin이 우선
  pointMaxMin: 15,                              // 이 길이 이하 일정은 "그 시각" 일정(등원·하원)으로 취급
  allDayRemind: { start: 8, end: 12 },          // 종일 일정 #알림: 그날 이 시간대에 한 번
  quickTitles: ["등원", "하원", "학원", "병원", "외식"],   // 일정 추가 화면의 빠른 제목

// 알림의 html 필드용: 스크립트·이벤트 핸들러·외부 임베드 제거 (인라인 style은 허용)
function sanitize(html) {
  const doc = new DOMParser().parseFromString(`<div>${html ?? ""}</div>`, "text/html");
  doc.querySelectorAll("script,style,iframe,frame,object,embed,link,meta,base,form,input,textarea,select,button").forEach((e) => e.remove());
  doc.querySelectorAll("*").forEach((el) => {
    for (const a of [...el.attributes]) {
      const n = a.name.toLowerCase(), v = a.value.trim().toLowerCase();
      if (n.startsWith("on") || (/^(href|src|xlink:href|action|formaction)$/.test(n) && v.startsWith("javascript:"))) el.removeAttribute(a.name);
    }
  });
  return doc.body.firstElementChild.innerHTML;
}

/* ================= clock ================= */
const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
let lastMin = -1, lastDay = -1;
function tickClock() {
  const d = new Date();
  if (d.getMinutes() === lastMin) return;
  lastMin = d.getMinutes();
  if (d.getDate() !== lastDay) {               // 날짜가 바뀌면 반복 일정을 새로 펼친다
    const first = lastDay === -1;
    lastDay = d.getDate();
    if (!first) rebuildAgenda();
  }
  $("#clock").innerHTML = `${pad2(d.getHours())}<span class="colon">:</span>${pad2(d.getMinutes())}`;
  $("#dateText").innerHTML = `${d.getMonth() + 1}월 ${d.getDate()}일 <b>${DAYS[d.getDay()]}요일</b>`;
  applyTimeOfDay(d);
  renderDock();   // 상대 시간 갱신
  renderAgenda(); // 지난 일정 넘기기
}

let nightOverride = null;
function applyTimeOfDay(d = new Date()) {
  const h = d.getHours() + d.getMinutes() / 60;
  const stops = [[0, [10, 16, 34]], [6, [24, 22, 52]], [9, [22, 38, 70]], [13, [24, 44, 78]], [17, [46, 36, 58]], [19.5, [30, 26, 54]], [22, [12, 18, 38]], [24, [10, 16, 34]]];
  let i = 0; while (h > stops[i + 1][0]) i++;
  const [h0, c0] = stops[i], [h1, c1] = stops[i + 1], t = (h - h0) / (h1 - h0);
  const c = c0.map((v, k) => Math.round(v + (c1[k] - v) * t));
  document.documentElement.style.setProperty("--sky", `rgb(${c.join(",")})`);
  document.body.classList.toggle("night", nightOverride ?? inHours(d.getHours(), CONFIG.night));
}

/* ================= weather ================= */
const WMO = (code, day = true) => {
  if (code === 0) return [day ? "sun" : "moon", "맑음"];
  if (code === 1) return [day ? "sun" : "moon", "대체로 맑음"];
  if (code === 2) return [day ? "partly" : "partlyN", "구름 조금"];
  if (code === 3) return ["cloud", "흐림"];
  if (code === 45 || code === 48) return ["fog", "안개"];
  if (code >= 51 && code <= 57) return ["rain", "이슬비"];
  if (code >= 61 && code <= 67) return ["rain", "비"];
  if (code >= 71 && code <= 77) return ["snow", "눈"];
  if (code >= 80 && code <= 82) return ["rain", "소나기"];
  if (code === 85 || code === 86) return ["snow", "소낙눈"];
  if (code >= 95) return ["storm", "뇌우"];
  return ["cloud", "-"];
};

async function fetchWeather() {
  const u = new URL("https://api.open-meteo.com/v1/forecast");
  u.search = new URLSearchParams({
    latitude: CONFIG.lat, longitude: CONFIG.lon, timezone: "Asia/Seoul", forecast_days: 2,
    current: "temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day",
    hourly: "temperature_2m,weather_code,precipitation_probability,is_day",
    daily: "temperature_2m_max,temperature_2m_min",
  });
  const r = await fetch(u, { cache: "no-store" });
  if (!r.ok) throw new Error("weather " + r.status);
  return r.json();
}

function sampleWeather() { // 네트워크가 막힌 미리보기용 예시 데이터
  const now = new Date(), base = new Date(now); base.setMinutes(0, 0, 0);
  const time = [], temperature_2m = [], weather_code = [], precipitation_probability = [], is_day = [];
  for (let i = 0; i < 30; i++) {
    const t = new Date(base.getTime() + i * 3600e3), h = t.getHours();
    time.push(`${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())}T${pad2(h)}:00`);
    temperature_2m.push(Math.round(4 + 5 * Math.sin(((h - 9) / 24) * 2 * Math.PI)));
    weather_code.push(h >= 15 && h <= 19 ? 61 : h % 5 === 0 ? 3 : 2);
    precipitation_probability.push(h >= 14 && h <= 20 ? 40 + (h % 3) * 15 : 0);
    is_day.push(h >= 7 && h < 18 ? 1 : 0);
  }
  return {
    sample: true,
    current: { temperature_2m: temperature_2m[0], apparent_temperature: temperature_2m[0] - 3, relative_humidity_2m: 58, weather_code: weather_code[0], is_day: is_day[0] },
    hourly: { time, temperature_2m, weather_code, precipitation_probability, is_day },
    daily: { temperature_2m_max: [9], temperature_2m_min: [1] },
  };
}

function renderWeather(w) {
  const c = w.current, [ico, label] = WMO(c.weather_code, !!c.is_day);
  const now = Date.now();
  const start = w.hourly.time.findIndex((t) => new Date(t).getTime() > now - 3600e3);
  const hours = [];
  for (let i = Math.max(start, 0) + 1; hours.length < 6 && i < w.hourly.time.length; i += 2) {
    const [hi] = WMO(w.hourly.weather_code[i], !!w.hourly.is_day[i]);
    const p = w.hourly.precipitation_probability[i];
    hours.push(`<div class="hr"><span class="t">${new Date(w.hourly.time[i]).getHours()}시</span>${svg(hi)}<span class="v">${Math.round(w.hourly.temperature_2m[i])}°</span><span class="p">${p >= 20 ? p + "%" : ""}</span></div>`);
  }
  $("#wx").innerHTML = `
    <div class="wx-now">
      ${svg(ico, 1.3)}
      <div class="wx-temp">${Math.round(c.temperature_2m)}<sup>°C</sup></div>
      <div class="wx-desc">
        <span class="cond">${label}</span>
        <span>체감 ${Math.round(c.apparent_temperature)}° · 습도 ${c.relative_humidity_2m}%</span>
        <span>최고 ${Math.round(w.daily.temperature_2m_max[0])}° · 최저 ${Math.round(w.daily.temperature_2m_min[0])}° · ${esc(CONFIG.place)} ${w.sample ? '<span class="tag">예시</span>' : ""}</span>
      </div>
    </div>
    <div class="wx-hours">${hours.join("")}</div>`;
  setPrecip(c.weather_code);
}

let wxRetry = 0;
async function updateWeather() {
  try {
    const w = await fetchWeather();
    wxRetry = 0;
    store.set("kiosk.wx", w);
    renderWeather(w);
  } catch (e) {
    const cached = store.get("kiosk.wx", null);
    renderWeather(cached || sampleWeather());
    if (wxRetry++ < 3) setTimeout(updateWeather, 60e3);
  }
}

/* ================= precipitation backdrop ================= */
// 현재 날씨가 비/눈이면 배경에 은은하게 내린다. 30fps 제한, 저해상도 캔버스.
const fx = { kind: null, level: 0, parts: [], raf: 0, last: 0, override: undefined, code: 0, w: 0, h: 0 };
const fxCanvas = $("#fx"), fxCtx = fxCanvas.getContext("2d");
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function precipOf(code) {
  if ([51, 53, 55, 56, 57, 61, 66, 80].includes(code)) return ["rain", 1];
  if ([63, 81].includes(code)) return ["rain", 2];
  if ([65, 67, 82].includes(code) || code >= 95) return ["rain", 3];
  if ([71, 77, 85].includes(code)) return ["snow", 1];
  if (code === 73) return ["snow", 2];
  if ([75, 86].includes(code)) return ["snow", 3];
  return [null, 0];
}
function setPrecip(code) { fx.code = code; applyPrecip(); }
function applyPrecip(force = false) {
  const [kind, level] = fx.override !== undefined ? fx.override : precipOf(fx.code);
  if (!force && kind === fx.kind && level === fx.level) return;
  fx.kind = kind; fx.level = level;
  resizeFx();
  fx.parts = kind ? Array.from({ length: fxCount() }, () => newDrop(true)) : [];
  fxCtx.clearRect(0, 0, fx.w, fx.h);
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (kind && !fx.raf && !still) fx.raf = requestAnimationFrame(fxFrame);
  if (!kind && fx.raf) { cancelAnimationFrame(fx.raf); fx.raf = 0; }
}
function resizeFx() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.25);
  fx.w = innerWidth; fx.h = innerHeight;
  fxCanvas.width = Math.round(fx.w * dpr); fxCanvas.height = Math.round(fx.h * dpr);
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function fxCount() {
  const per = fx.kind === "snow" ? [0, 40, 80, 140] : [0, 45, 95, 170];
  return Math.round(per[fx.level] * (fx.w * fx.h) / (457 * 731));
}
function newDrop(anywhere) {
  const snow = fx.kind === "snow";
  return {
    x: Math.random() * (fx.w + 80) - 60,
    y: anywhere ? Math.random() * fx.h : -30 - Math.random() * fx.h * 0.25,
    v: snow ? 0.5 + Math.random() * 0.9 : 9 + Math.random() * 6 + fx.level,
    s: snow ? 0.9 + Math.random() * 1.8 : 10 + Math.random() * 12,
    a: snow ? 0.22 + Math.random() * 0.33 : 0.08 + Math.random() * 0.14,
    p: Math.random() * Math.PI * 2,
  };
}
function fxFrame(t) {
  fx.raf = requestAnimationFrame(fxFrame);
  if (document.hidden || t - fx.last < 33) return;
  fx.last = t;
  const g = fxCtx, snow = fx.kind === "snow", slant = 0.16;
  g.clearRect(0, 0, fx.w, fx.h);
  g.fillStyle = g.strokeStyle = cssVar(snow ? "--snow" : "--rain");
  g.lineWidth = 1; g.lineCap = "round";
  for (const q of fx.parts) {
    if (snow) {
      q.p += 0.03; q.x += Math.sin(q.p) * 0.45; q.y += q.v;
      g.globalAlpha = q.a; g.beginPath(); g.arc(q.x, q.y, q.s, 0, 6.2832); g.fill();
    } else {
      q.x += q.v * slant; q.y += q.v;
      g.globalAlpha = q.a; g.beginPath(); g.moveTo(q.x, q.y); g.lineTo(q.x - q.s * slant, q.y - q.s); g.stroke();
    }
    if (q.y - q.s > fx.h || q.x > fx.w + 40) Object.assign(q, newDrop(false));
  }
  g.globalAlpha = 1;
}
window.addEventListener("resize", () => fx.kind && applyPrecip(true));

/* ================= notifications =================
   notify({
     id, source, level: info|warn|urgent|ok, icon,
     title, body,                     // 텍스트 카드
     html,                            // 또는 HTML 카드 (스크립트/이벤트 제거 후 렌더)
     progress: { step, steps: [...] },
     detail: { text | html | fields: [[k, v]...] },
     tap: <action>,                   // 카드를 눌렀을 때 (기본: detail)
     actions: [{ label, style: primary|danger, action: <action>, dismiss }],   // 세부 화면 버튼
     sound: chime|alert|none|<audio url>, speak: true|"문장",
     remind: { everySec, max },       // 확인할 때까지 반복 알림
     ttlSec | expiresAt, silent
   })
   <action> = { type: detail|dismiss|speak|snooze(minutes)|url(url)|http(url, method, body, headers)|native(name, args) }
================================================== */
const notifs = new Map(store.get("kiosk.notifs", []).map((n) => [n.id, n]));
const persist = () => store.set("kiosk.notifs", [...notifs.values()]);

function visible() {
  const now = Date.now();
  return [...notifs.values()].filter((n) => !(n.snoozeUntil > now))
    .sort((a, b) => (LEVEL_RANK[b.level] ?? 1) - (LEVEL_RANK[a.level] ?? 1) || b.updatedAt - a.updatedAt);
}
function relTime(ts) {
  const m = Math.floor((Date.now() - ts) / 60e3);
  if (m < 1) return "방금";
  if (m < 60) return `${m}분 전`;
  const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
const srcOf = (n) => SOURCES[n.source] || { label: n.sourceLabel || n.source || "알림", icon: "bell" };
const iconOf = (n) => n.icon || (n.level === "urgent" && !SOURCES[n.source] ? "alert" : srcOf(n).icon);
const lv = (n) => `lv-${esc(LEVEL_RANK[n.level] !== undefined ? n.level : "info")}`;
const speechOf = (n) => (n.speak === true ? [n.title, n.body].filter(Boolean).join(". ") : n.speak);
const metaHtml = (n, ts = n.updatedAt) =>
  `<span class="dot"></span>${esc(srcOf(n).label)} · ${relTime(ts)}${n.demo ? ' <span class="tag">예시</span>' : ""}`;

function stepsHtml(pr) {
  if (!pr || !Array.isArray(pr.steps)) return "";
  return `<div class="steps">${pr.steps.map((s, i) =>
    `<div class="step ${i < pr.step ? "done" : i === pr.step ? "now" : ""}"><i></i>${esc(s)}</div>`).join("")}</div>`;
}
function cardHtml(n) {
  const content = n.html
    ? `<div class="c-html">${sanitize(n.html)}</div>`
    : `<span class="c-title">${esc(n.title)}</span>${n.body ? `<span class="c-body">${esc(n.body)}</span>` : ""}`;
  return `<div class="card ${lv(n)}" role="button" tabindex="0" data-id="${esc(n.id)}">
    <span class="ico">${svg(iconOf(n))}</span>
    <span class="c-main"><span class="c-meta">${metaHtml(n)}</span>${content}${stepsHtml(n.progress)}</span>
    <span class="chev" aria-hidden="true">›</span>
  </div>`;
}
function rowHtml(n) {
  const sub = n.progress?.steps?.[n.progress.step] || "";
  return `<div class="row ${lv(n)}" role="button" tabindex="0" data-id="${esc(n.id)}">
    <span class="ico sm">${svg(iconOf(n))}</span>
    <span class="r-title">${esc(n.title || srcOf(n).label)}${sub ? `<small>${esc(sub)}</small>` : ""}</span>
    <span class="r-time">${relTime(n.updatedAt)}</span>
    <span class="chev" aria-hidden="true">›</span>
  </div>`;
}

let dockSig = "";
function renderDock() {
  const list = visible();
  const full = list.slice(0, CONFIG.fullCards);
  const rows = list.slice(CONFIG.fullCards, CONFIG.fullCards + CONFIG.compactRows);
  const rest = list.length - full.length - rows.length;
  const html = full.map(cardHtml).join("") + rows.map(rowHtml).join("") +
    (rest > 0 ? `<button type="button" class="more" data-more="1">알림 ${rest}건 더 보기</button>` : "");
  if (html === dockSig) return;
  dockSig = html;
  $("#dock").innerHTML = html;
}

function notify(input) {
  const n0 = typeof input === "string" ? JSON.parse(input) : { ...input };
  const id = String(n0.id || `n-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`);
  const prev = notifs.get(id), now = Date.now();
  const n = { level: "info", ...prev, ...n0, id, updatedAt: now, receivedAt: prev?.receivedAt || now };
  if (n0.ttlSec) n.expiresAt = now + n0.ttlSec * 1000;
  if (typeof n.expiresAt === "string") n.expiresAt = Date.parse(n.expiresAt);
  delete n.snoozeUntil;
  if (!n0.silent) { n.ack = false; n.remindCount = 0; n.lastAnnounced = now; }
  else if (!n.lastAnnounced) n.lastAnnounced = now;   // 조용히 추가돼도 반복 알림은 주기만큼 기다린 뒤 시작
  notifs.set(id, n);
  persist();
  renderDock();
  if (!n0.silent) announce(n);
  if (openSheetId === id) openDetail(id);
  return id;
}
function dismiss(id) { notifs.delete(id); persist(); renderDock(); if (openSheetId === id) closeSheet(); }
function clearAll() { notifs.clear(); persist(); renderDock(); closeSheet(); }
function snooze(id, minutes = 5) {
  const n = notifs.get(id); if (!n) return;
  n.snoozeUntil = Date.now() + minutes * 60e3; n.ack = true;
  persist(); renderDock(); closeSheet();
  flash({ title: `${minutes}분 뒤에 다시 알려드릴게요`, level: "info", icon: "bell" });
}

/* 만료 · 다시 알림 · 반복 알림 */
function tickNotifs() {
  const now = Date.now(); let changed = false;
  for (const n of [...notifs.values()]) {
    if (n.expiresAt && n.expiresAt <= now) { notifs.delete(n.id); changed = true; continue; }
    if (n.snoozeUntil && n.snoozeUntil <= now) {
      delete n.snoozeUntil; n.ack = false; n.remindCount = 0; n.updatedAt = n.lastAnnounced = now;
      announce(n); changed = true; continue;
    }
    if (n.ack === undefined) n.ack = false;
    const r = n.remind;
    if (r && !n.ack && !n.snoozeUntil && now - (n.lastAnnounced || 0) >= r.everySec * 1000 && (n.remindCount || 0) < (r.max ?? Infinity)) {
      n.lastAnnounced = now; n.remindCount = (n.remindCount || 0) + 1; changed = true;
      announce(n);
    }
  }
  if (changed) { persist(); renderDock(); }
  agendaReminders(now);
}

/* 도착 연출: 토스트 + 효과음 + 음성 */
let toastTimer;
function flash(n, ms = 4000) {
  const t = $("#toast");
  t.className = lv(n);
  t.innerHTML = `<span class="ico">${svg(iconOf(n))}</span><span class="c-main">${n.source ? `<span class="c-meta">${esc(srcOf(n).label)}</span>` : ""}<span class="c-title">${esc(n.title || "새 알림")}</span>${n.body ? `<span class="c-body">${esc(n.body)}</span>` : ""}</span>`;

}
function announce(n) {
  if (n.level === "urgent" && !$("#sheet").hidden && openSheetId !== n.id) closeSheet(); // 긴급은 열린 화면보다 우선
  flash(n, n.level === "urgent" ? 12000 : 6000);
  playSound(n.sound ?? (n.level === "urgent" ? "alert" : "chime"), n.level);
  if (n.speak) speak(speechOf(n), n.level);

let actx;
function playSound(kind, level) {
  if (!kind || kind === "none") return;
  try {
    if (/^(https?:|\/|\.)/.test(kind)) { new Audio(kind).play().catch(() => {}); return; }
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const notes = kind === "alert" ? [880, 660, 880, 660] : level === "warn" ? [740, 554] : [659, 880];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + i * 0.18;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.18, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + 0.65);
    });
  } catch {}
}
function speak(text, level, force = false) {
  if (!text) return;
  if (!force && inHours(new Date().getHours(), CONFIG.quiet) && level !== "urgent") return;
  setTimeout(() => {
    try {
      if (native?.speak) return native.speak(String(text));
      if (!("speechSynthesis" in window)) return;
      const u = new SpeechSynthesisUtterance(String(text)); u.lang = "ko-KR"; u.rate = 1;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch {}
  }, 700);
}

/* 동작 실행: 카드 탭, 세부 화면 버튼이 모두 이걸 쓴다 */
async function perform(action, n) {
  const a = typeof action === "string" ? { type: action } : action || { type: "detail" };
  switch (a.type) {
    case "detail": openDetail(n.id); break;
    case "dismiss": dismiss(n.id); break;
    case "speak": speak(speechOf(n), n.level, true); break;
    case "snooze": snooze(n.id, a.minutes || 5); break;
    case "url": openFrame(a.url, a.title || n.title); break;
    case "native":
      if (native?.action) native.action(String(a.name), JSON.stringify(a.args ?? {}));
      else flash({ title: "기기 앱에서만 실행되는 동작이에요", body: a.name, level: "warn" });
      break;
    case "http":
      try {
        const r = await fetch(a.url, {
          method: a.method || "POST",
          headers: { "Content-Type": "application/json", ...(a.headers || {}) },
          body: a.body === undefined ? undefined : typeof a.body === "string" ? a.body : JSON.stringify(a.body),
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        flash({ title: a.doneText || "요청을 보냈어요", level: "ok", icon: "check" });
      } catch (e) {
        flash({ title: "요청을 보내지 못했어요", body: `${a.url} · ${e.message}`, level: "urgent", icon: "alert" });
        return;
      }
      break;
  }
  if (a.dismiss && a.type !== "dismiss") dismiss(n.id);
}

/* ================= agenda =================
   setAgenda([{ id, title, start, end, allDay, location, note, calendar, color, remindBeforeMin }])
   start/end: ISO 문자열 ("2026-11-20T14:00:00+09:00") 또는 종일 일정이면 "2026-11-20"
   목록 전체를 통째로 교체한다 (캘린더 동기화 결과를 그대로 넘기면 됨).

const parseWhen = (v) => {

// 종료 시간이 없거나 시작과 같으면 "그 시각에 일어나는 일정"(등원·하원 등):
// 진행 중 표시 없이, 시작 후 POINT_GRACE 동안만 남아 있다가 다음 일정으로 넘어간다.

  if (point) en = s;
  else if (isNaN(en)) en = dayStart(s, 1);
  return { ...e, id: String(e.id || `${e.title}-${s}`), s, e: en, point, until: point ? s + POINT_GRACE : en };
}
const evTime = (e) => (e.allDay ? "종일" : e.point ? hhmm(e.s) : `${hhmm(e.s)} ~ ${hhmm(e.e)}`);
let agendaRaw = store.get("kiosk.agenda", []);      // API(PUT /api/agenda)로 받은 일정
let calItems = store.get("kiosk.calItems", []);     // 캘린더(ICS)에서 펼친 오늘·내일 일정 (마지막 동기화 결과)
let gasItems = store.get("kiosk.gasItems", []);     // Apps Script 웹 앱에서 받은 일정 (반영이 빠름)
const calStore = {};                                // 캘린더 이름 → { cfg, evs }

function mergeSources() {
  const seen = new Set();
  return gasItems.concat(calItems, agendaRaw).filter((e) => {
    if (!e.uid) return true;
    const k = `${e.uid}|${typeof e.start === "number" ? e.start : parseWhen(e.start)}`;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  }).map(normEvent).filter(Boolean).sort((a, b) => a.s - b.s);
}

    const from = dayStart(Date.now()), to = dayStart(Date.now(), 2);
    calItems = Object.values(calStore).flatMap(({ cfg, evs }) => ICS.toAgenda(evs, cfg, from, to));
    store.set("kiosk.calItems", calItems);
  }
  agenda = mergeSources();
  agendaSig = null;
  renderAgenda();
}
/* Apps Script 웹 앱이 준 일정(이미 펼쳐진 것): { uid, title, start, end, allDay, location, description, calendar, color } */
function loadEvents(source, list) {

  gasItems = arr.map((ev) => {

    return {
      id: `${source}:${ev.uid}:${ev.start}`, uid: ev.uid, title: tags.title || "(제목 없음)",
      start: ev.start, end: ev.end, allDay: !!ev.allDay, location: ev.location || "", note: tags.note,
      calendar: ev.calendar || "", color: ev.color || undefined,

function loadIcs(name, cfg, text) {

function submitAdd(dayOff) {

/* 일정 미리 알림: remind 분 전마다 알림 카드 + 음성 (#알림 30,5 → 30분 전, 5분 전) */
const reminded = new Set(store.get("kiosk.reminded", []));
function agendaReminders(now) {
  let dirty = false;
  const hour = new Date(now).getHours(), today = dayStart(now);
  for (const e of agenda) {
    if (e.allDay) {
      // 종일 일정 #알림: 해당하는 날 아침(allDayRemind 시간대)에 한 번
      if (!remindsOf(e).length || now < e.s || now >= e.until) continue;
      if (hour < CONFIG.allDayRemind.start || hour >= CONFIG.allDayRemind.end) continue;
      const key = `${e.id}@day${today}`;
      if (reminded.has(key)) continue;
      reminded.add(key); dirty = true;
      notify({
        id: `cal-${e.id}-${today}`, source: "calendar", demo: e.demo, icon: "calendar",
        title: `오늘 · ${e.title}`, body: e.location || e.calendar || "",
        speak: `오늘은 ${e.title} 일정이 있습니다.${e.speakText ? ` ${e.speakText}` : ""}`,
        expiresAt: dayStart(now, 1), tap: { type: "detail" },
        detail: { fields: [["언제", "종일"], ...(e.location ? [["장소", e.location]] : []), ...(e.note ? [["메모", e.note]] : [])] },
      });
      continue;
    }
    if (now >= e.s) continue;
    const due = remindsOf(e).filter((rm) => now >= e.s - rm * 60e3);
    if (!due.some((rm) => !reminded.has(`${e.id}@${e.s}@${rm}`))) continue;
    due.forEach((rm) => reminded.add(`${e.id}@${e.s}@${rm}`)); dirty = true;   // 늦게 켜졌으면 한 번만
    const left = Math.max(1, Math.round((e.s - now) / 60e3));
    notify({
      id: `cal-${e.id}`, source: "calendar", demo: e.demo, icon: "calendar",
      title: `${left}분 뒤 · ${e.title}`, body: `${hhmm(e.s)}${e.location ? ` · ${e.location}` : ""}`,
      speak: `${left}분 뒤에 ${e.title} 일정이 있습니다.${e.speakText ? ` ${e.speakText}` : ""}`,
      expiresAt: e.until, tap: { type: "detail" },
      detail: { fields: [["시간", evTime(e)], ...(e.location ? [["장소", e.location]] : []), ...(e.speakText ? [["알림 멘트", e.speakText]] : []), ...(e.note ? [["메모", e.note]] : [])] },
    });
  }
  if (dirty) {
    const keep = [...reminded].slice(-200);
    store.set("kiosk.reminded", keep);
  }
}

function onActivate(e) {
  if (e.target.closest("#demo, #demoBtn")) return;
  const hit = e.target.closest(".card, .row");
  if (hit) {
    e.preventDefault(); // html 카드 안의 링크로 페이지가 넘어가지 않게

  if (e.target === $("#sheet")) closeSheet();
}

/* ================= clock placement + burn-in guard ================= */
// 시계 영역 가운데를 기준으로 ±driftPx 안에서만 천천히 이동. 영역보다 크면 축소해서 알림 영역을 침범하지 않음.
let driftTimer, placed = false;
function placeFloat(durSec) {
  const z = $("#zone"), fl = $("#float");
  const zw = z.clientWidth, zh = z.clientHeight;
  if (!zw || !zh) return;
  // 넘치면 덜 중요한 것부터 숨기고, 그래도 넘치면 축소
  fl.classList.remove("c1", "c2", "c3");
  fitDayLine();
  fitAgenda();
  let fw = fl.offsetWidth, fh = fl.offsetHeight;
  for (const c of ["c1", "c2", "c3"]) {
    if (fw <= zw && fh <= zh) break;
    fl.classList.remove("c1", "c2", "c3"); fl.classList.add(c);
    fw = fl.offsetWidth; fh = fl.offsetHeight;
  }
  if (!fw || !fh) return;
  const s = Math.min(1, zw / fw, zh / fh);
  const slackX = (zw - fw * s) / 2, slackY = (zh - fh * s) / 2;
  const rx = Math.min(CONFIG.driftPx, slackX), ry = Math.min(CONFIG.driftPx, slackY);
  const cur = fl._off || { dx: 0, dy: 0 };
  let dx, dy, tries = 0;
  do { dx = (Math.random() * 2 - 1) * rx; dy = (Math.random() * 2 - 1) * ry; }
  while (++tries < 8 && Math.hypot(dx - cur.dx, dy - cur.dy) < Math.max(rx, ry) * 0.7);
  fl._off = { dx, dy };
  fl.style.transitionDuration = placed ? `${durSec}s` : "0s";
  fl.style.transform = `translate(${Math.round(slackX + dx)}px, ${Math.round(slackY + dy)}px) scale(${s.toFixed(3)})`;
  placed = true;
}
function scheduleDrift() {
  clearTimeout(driftTimer);
  placeFloat(1.2);
  driftTimer = setTimeout(function loop() { placeFloat(CONFIG.driftDurationSec); driftTimer = setTimeout(loop, CONFIG.driftEverySec * 1000); }, CONFIG.driftEverySec * 1000);
}
function pixelShift() {
  const r = () => Math.round(Math.random() * 4 - 2);
  $("#stage").style.transform = `translate(${r()}px, ${r()}px)`;
}

/* ================= 다른 앱 알림 → 카드 =================
   기기 앱이 감시 대상 앱의 알림을 raw 로 넘긴다 (형식은 apps/registry.js).
   누구 알림이든 기본 카드로 띄우고, 앱별 손질은 apps/<앱>.js 어댑터가 맡는다.
   앱이 스스로 알림을 거두면(주문 끝 등) 그 알림으로 만든 카드도 닫는다.
================================================== */
function androidCard(r) {
  const app = KioskApps.get(r.package);
  const body = r.bigText || r.text || (r.lines || []).join("\n");
  const base = {
    id: `app:${r.package}:${r.tag}:${r.id}`,
    source: "app", sourceLabel: app?.label || r.appLabel || r.package, icon: app?.icon || "bell",
    title: r.title || app?.label || r.appLabel || "알림", body,
    detail: { text: [r.title, body, r.subText].filter(Boolean).join("\n") },
    ttlSec: r.ongoing ? 12 * 3600 : 2 * 3600,
  };
  let extra;
  try { extra = app?.card ? app.card(r) : undefined; }
  catch (e) { console.warn("adapter", r.package, e); }
  if (extra === null) return null;
  const n = { ...base, ...(extra || {}), androidKey: r.key };
  if (!n.id) n.id = base.id;
  return n;
}
function ingestAndroid(raw) {
  const r = typeof raw === "string" ? JSON.parse(raw) : raw;
  const n = androidCard(r);
  if (!n) return false;
  const prev = notifs.get(n.id);
  if (prev && prev.title === n.title && prev.body === n.body && prev.progress?.step === n.progress?.step) n.silent = true;  // 같은 내용 재게시
  notify(n);
  return true;
}
function removeAndroid(key) {
  for (const n of [...notifs.values()]) if (n.androidKey === key) dismiss(n.id);
}

/* ================= public API for native shell / scripts ================= */
window.kiosk = { notify, dismiss, snooze, clear: clearAll, list: () => visible(), setAgenda, agenda: () => agenda, ingestAndroid, removeAndroid, loadIcs, setCalendars, loadEvents, onAddResult };
